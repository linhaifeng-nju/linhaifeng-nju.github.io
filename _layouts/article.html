<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.summary | default: site.title | escape }}">
  <meta name="color-scheme" content="light">
  <title>{{ page.title | escape }} · {{ site.title | escape }}</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2016%2016%22%3E%3C%2Fsvg%3E">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
  <script src="/code-blocks.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">跳至正文</a>
  <div class="page">
    <header class="header">
      <a class="motto" href="/#work">纵有疾风起，人生不言弃</a>
      <div class="controls">
        <nav aria-label="栏目">
          <a href="/#work" {% if page.category != "life" %}aria-current="page"{% endif %}>Work</a>
          <a href="/#life" {% if page.category == "life" %}aria-current="page"{% endif %}>Life</a>
        </nav>
      </div>
    </header>
    <main id="main" tabindex="-1" data-article>
      <a class="back" href="/#{{ page.category | default: 'work' }}">← {{ page.category | default: 'work' | capitalize }}</a>
      <article>
        <header class="article-head">
          <div class="meta">{{ page.category | default: 'Work' }}{% if page.date %} · {{ page.date | date: "%Y-%m-%d" }}{% endif %}</div>
          <h1>{{ page.title | escape }}</h1>
        </header>
        <div class="prose">{% include lazy-images.html html=content %}</div>
      </article>
    </main>
    <footer><span>Work &amp; Life</span><a href="https://github.com/linhaifeng-nju">GitHub ↗</a></footer>
  </div>
</body>
</html>
